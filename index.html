<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadtjagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F5EE; --card:#FFFFFF; --ink:#17302A; --muted:#5B6F68; --line:#D3DECF;
  --contour:#CFDBC8; --flag:#EE5F1B; --flag-ink:#FFFFFF; --water:#2F6E9E;
  --ok:#2E7D4F; --err:#B3261E; --ok-bg:#E3F1E7; --err-bg:#FBE9E7; --err-btn:#B3261E; --info-bg:#E6EEF4;
  --head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1B18; --card:#16261F; --ink:#E4EEE8; --muted:#9BB1A9; --line:#2A3F38;
  --contour:#1C312B; --flag:#FF7A3A; --water:#6FA8D6; --ok:#6CCB8E; --err:#FF8A80; --err-btn:#C5372C;
  --ok-bg:#16332A; --err-bg:#3A1F1C; --info-bg:#172A36;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);min-height:100vh}
/* Hintergrund wie eine Wanderkarte: Hoehenlinien, Fluss, Wege, Wegpunkte */
.topo{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.topo .c,.topo .c5{fill:none;stroke:var(--contour);stroke-width:1}
.topo .c5{stroke-width:1.9}
.topo .w{fill:none;stroke:var(--water);stroke-width:2.4;opacity:.38}
.topo .wl{fill:none;stroke:var(--water);stroke-width:1.1;opacity:.22}
.topo .t{fill:none;stroke:var(--flag);stroke-width:1.7;stroke-dasharray:8 6;stroke-linecap:round;opacity:.4}
.topo .t2{stroke-dasharray:3 5;opacity:.3}
.topo .p{fill:none;stroke:var(--contour);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.topo .pf{fill:var(--contour);stroke:none}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:20px 16px 70px}
main.wide{max-width:900px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1}
h1{font-size:32px;font-weight:700}h2{font-size:24px;font-weight:700}h3{font-size:19px;font-weight:600}
p{margin:.4em 0 0}
.muted{color:var(--muted)}.small{font-size:14px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.flag{width:32px;height:32px;flex:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
input,textarea,select{width:100%;font:500 17px var(--body);padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:64px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 16px;font:700 18px var(--head);cursor:pointer;background:var(--flag);color:var(--flag-ink);margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:15px;margin:0 6px 6px 0;min-height:42px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.msg.err{background:var(--err-bg);color:var(--err)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.info{background:var(--info-bg);color:var(--ink)}
.msg .btn{margin-top:10px}
.link{background:none;border:0;padding:10px 4px;min-height:42px;margin-top:4px;font:600 15px var(--body);color:var(--muted);text-decoration:underline;cursor:pointer}
.count{font:700 42px var(--head);line-height:1}
ul.names{list-style:none;padding:0;margin:10px 0 0;columns:2;column-gap:14px;font-size:15px}
ul.names li{padding:3px 0;break-inside:avoid;border-bottom:1px dotted var(--line)}
.leader{color:var(--flag);font-weight:600}
.lock{display:flex;gap:6px;justify-content:center;margin:4px 0}
.wheel{width:44px;height:58px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 32px var(--head)}
.wheel.klein{width:34px;height:42px;font-size:22px;border-radius:6px}
.ziffern .lock{justify-content:flex-start;margin-top:8px}
.wheel.empty{color:color-mix(in srgb,var(--paper) 30%,transparent)}
.route{display:flex;align-items:center;margin:12px 2px 2px}
.route i{flex:1;height:3px;background:var(--line)}.route i.done{background:var(--flag)}
.route b{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font:700 14px var(--head);background:var(--card);color:var(--muted)}
.route b.done{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.route b.now{border-color:var(--flag);color:var(--flag)}
.compass{display:flex;gap:16px;align-items:center;margin-top:12px}
.compass svg{width:78px;height:78px;flex:none}
.ring{fill:none;stroke:var(--line);stroke-width:3}
.needle{fill:var(--flag);transform-origin:39px 39px}
/* Richtung noch unbekannt: kein Pfeil, der etwas vortäuscht, sondern ein Fragezeichen */
.compass .nq{display:none;font:700 26px var(--head);fill:var(--muted)}
.compass.unsicher .nq{display:inline}
.compass.unsicher .needle{display:none}
.names .del{min-width:40px;min-height:40px;padding:0;margin:0 0 0 6px;font-size:18px;line-height:1}
.fehlt{color:var(--err);font-weight:600}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.wahl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* Kompass einmessen: Handy fährt eine liegende Acht ab */
.acht{display:block;width:100%;max-width:260px;height:auto;margin:10px auto 0}
.acht .bahn{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:6 6}
.acht .handy{fill:var(--card);stroke:var(--ink);stroke-width:2.5}
.acht .schirm{fill:var(--flag);opacity:.85}
.fort{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:14px}
.fort span{display:block;height:100%;width:0;background:var(--flag);transition:width .3s linear}
.werte{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px;color:var(--muted)}
.werte b{color:var(--ink);white-space:nowrap}
.dist{font:700 38px var(--head);line-height:1}
.hint{font-size:19px;font-weight:500}
.riddle{font-size:19px;border-left:4px solid var(--flag);padding-left:12px}
.share{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--flag);flex:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font:600 17px var(--head);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--flag)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font:600 13px var(--body);background:var(--paper);border:1px solid var(--line)}
.chip.live{background:var(--flag);color:var(--flag-ink);border-color:var(--flag)}
.chip.test{background:var(--err-bg);color:var(--err);border-color:var(--err);margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:600 14px var(--body);color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--line);min-width:80px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--flag)}
#map{height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);margin-top:12px;background:var(--paper)}
#map.full{position:fixed;inset:0;height:100vh;z-index:50;border-radius:0;margin:0}
.mapbadge{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--flag);color:#fff;font:700 15px var(--head);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mapbadge.team{background:var(--water)}
.mapbadge.stale{background:#8b9c95}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:99px;font:600 14px var(--body);background:var(--card);border:1.5px solid var(--line);color:var(--ink);cursor:pointer;white-space:nowrap}
.tchip i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.tchip.off{opacity:.4}
.tchip.off i{background:transparent;border:2px solid var(--c)}
.tl-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tl-head input[type=range]{flex:1;min-width:140px;width:auto;padding:0;border:0;background:none;accent-color:var(--flag)}
.tl-time{font:700 22px var(--head);min-width:62px;text-align:center;white-space:nowrap}
.tl-rows{position:relative;margin-top:14px}
.tl-row{display:grid;grid-template-columns:104px 1fr 80px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.tl-row.off{opacity:.35}
.tl-name{font:600 15px var(--body);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.tl-name i{width:12px;height:12px;border-radius:50%;flex:none}
.tl-bar{position:relative;height:22px;background:var(--paper);border-radius:6px}
.tl-bar .seg{position:absolute;top:4px;height:14px;border-radius:3px;background:var(--c)}
.tl-bar .seg.solve{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);opacity:.55}
.tl-bar .st{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--card);border:2px solid var(--c);color:var(--ink);font:700 11px var(--head);display:grid;place-items:center;font-style:normal;z-index:1}
.tl-bar .win{position:absolute;top:1px;margin-left:12px;font:700 13px var(--head);color:var(--flag);white-space:nowrap}
.tl-bar .win.links{margin-left:-12px;transform:translateX(-100%)}   /* am rechten Rand nach innen */
.tl-total{font:700 15px var(--head);text-align:right;white-space:nowrap}
.tl-total small{display:block;font:500 12px var(--body);color:var(--muted)}
.tl-axis{position:relative;height:18px;margin:0 90px 0 114px;font:500 12px var(--body);color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--flag);margin-left:-1px;pointer-events:none;z-index:2}
.tl-cursor::after{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--flag)}
.tl-key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.tl-key span{display:inline-flex;align-items:center;gap:6px}
.tl-key b{display:inline-block;width:22px;height:10px;border-radius:2px;background:var(--muted)}
.tl-key b.solve{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.6}
.tl-key b.dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.btn.warn{background:var(--err-btn);color:#fff}
.panel.danger{border-color:var(--err);border-left-width:4px}
.panel.danger h3{color:var(--err)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(17,17,17,.45);display:grid;place-items:center;padding:16px;animation:ovin .16s cubic-bezier(.32,.72,.4,1)}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:430px;box-shadow:0 12px 32px rgba(17,17,17,.28),0 2px 6px rgba(17,17,17,.12);animation:dgin .16s cubic-bezier(.32,.72,.4,1)}
.dialog h2{color:var(--err)}
.dialog .why{background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.dialog .keeps{font-size:14px;color:var(--muted);margin-top:8px}
.dialog .row{display:flex;gap:8px;margin-top:16px}
.dialog .row .btn{margin-top:0}
@keyframes ovin{from{opacity:0}}
@keyframes dgin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.overlay,.dialog{animation:none}}
a.btn{text-decoration:none;text-align:center}
.btn.help{display:flex;align-items:center;justify-content:center;gap:9px}
.btn.help svg{width:19px;height:19px;flex:none}
.nav{display:flex;gap:6px;justify-content:center;margin-top:24px;font-size:14px}
.nav a{color:var(--muted);display:inline-block;padding:10px 8px;min-height:42px}
.nav span{color:var(--line);align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main id="app"></main>

<script src="config.js"></script>
<script>
/* ===========================================================
   KONFIGURATION – hier eintragen, bevor die Datei online geht.
   Beides findest du in Supabase unter Project Settings, API.
   Der anon-Key ist öffentlich und darf im Quelltext stehen.
   Der service_role-Key gehört NIEMALS hierher.
   =========================================================== */
// Die Werte stehen in config.js, die vor diesem Skript geladen wird.
const cfg = {
  url: (window.SJ_CONFIG && window.SJ_CONFIG.url) || localStorage.getItem("sj.url") || "",
  key: (window.SJ_CONFIG && window.SJ_CONFIG.key) || localStorage.getItem("sj.key") || ""
};

/* ---------- Grundlagen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const val = id => ($("#" + id)?.value || "").trim();
const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
const R_E = 6371000;

function haversine(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R_E * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingTo(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
const fmtDist = m => m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2).replace(".", ",") + " km";
function ago(ts) {
  if (!ts) return "nie";
  const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
  if (s < 60) return "vor " + s + " s";
  if (s < 3600) return "vor " + Math.round(s / 60) + " min";
  return "vor " + Math.round(s / 3600) + " h";
}

async function rpc(fn, args) {
  if (!cfg.url || !cfg.key) throw new Error("Die App ist noch nicht mit Supabase verbunden.");
  const res = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: cfg.key, Authorization: "Bearer " + cfg.key },
    body: JSON.stringify(args || {})
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && data.message) || "Fehler " + res.status);
  if (typeof data === "string") throw new Error("Unerwartete Antwort vom Server.");
  return data;
}

/* ---------- Zustand ---------- */
const S = {
  view: (location.hash.replace("#/", "") || "public"),
  msg: null, busy: false,
  pub: null, myName: localStorage.getItem("sj.name") || null, lookup: null,
  team: { code: localStorage.getItem("sj.code") || null, state: null },
  // kompass: "unbekannt" | "wartet" | "an" | "kalibrieren" | "relativ" | "abgelehnt" | "fehlt"
  gps: { pos: null, acc: null, heading: null, gpsHeading: null, needle: 0, on: false, err: null, kompass: "unbekannt", lastSent: 0, lastSentPos: null, sentAt: null,
         // kompassAcc: Genauigkeit in Grad (nur iOS), kal: laufendes Einmessen, kalOk: Ergebnis für den Hinweis danach
         kompassAcc: null, kal: null, kalOk: null },
  admin: { pin: sessionStorage.getItem("sj.pin") || null, state: null, tab: "map", edit: null, full: false,
           // Routen: tracks[teamId] = {name, points:[[lat,lng,ms]], stations:[...]}
           tracks: null, syncedAt: null, hidden: {}, cursor: null, playing: false, confirm: null,
           draw: { mode: "size", value: 10 } }
};
// Farben für bis zu 16 Teams, auf hellem wie dunklem Grund unterscheidbar
const TEAM_COLORS = ["#2F6E9E", "#2E7D4F", "#7B3FA0", "#C62828", "#F9A825", "#00838F", "#AD1457", "#4E6E1F",
  "#E65100", "#3949AB", "#00695C", "#8D6E63", "#D81B60", "#455A64", "#0277BD", "#9E9D24"];
const teamColor = i => TEAM_COLORS[i % TEAM_COLORS.length];
// Tier zum Teamnamen. Die Namen kommen aus admin_draw in der Datenbank.
const TEAM_EMOJI = {
  fuchs: "🦊", wolf: "🐺", eule: "🦉", tiger: "🐯", panda: "🐼", einhorn: "🦄",
  flamingo: "🦩", pinguin: "🐧", delfin: "🐬", adler: "🦅", igel: "🦔", otter: "🦦",
  krake: "🐙", biber: "🦫", koala: "🐨", drache: "🐉"
};
// Plätze mit Koffer: 1 bis 3 als Medaille, weitere Koffer-Plätze mit Koffer, danach die Zahl
const MEDAILLE = ["🥇", "🥈", "🥉"];
const platzZeichen = (place, prizes) => !place ? ""
  : place <= prizes ? (MEDAILLE[place - 1] || "🧳 " + place) : String(place);
const uhrzeit = ts => ts ? new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
const teamEmoji = name => TEAM_EMOJI[String(name || "").trim().toLowerCase()] || "🐾";

/* ---------- Löschbereich ---------- */
// Alles, was Daten entfernt, läuft über diese Liste und den Dialog darunter.
// Zwei Hürden: erst der Dialog, dann das getippte Wort.
const DANGER_WORD = "LÖSCHEN";
const wordOk = v => ["löschen", "loeschen"].includes(String(v || "").trim().toLowerCase());
const DANGER = {
  clearpos: {
    when: st => (st.teams || []).some(t => t.position),
    title: "Standortdaten löschen",
    lead: "Alle gespeicherten Positionen und die gelaufenen Routen aller Teams werden entfernt.",
    keeps: "Teams, Teilnehmende, Fortschritt und Ziffern bleiben.",
    btn: "Standortdaten löschen",
    async run() {
      S.admin.state = await rpc("admin_clear_positions", { p_pin: S.admin.pin });
      S.admin.tracks = null; S.admin.syncedAt = null; S.admin.cursor = null; stopPlay();
      return "Standortdaten und Routen gelöscht.";
    }
  },
  redraw: {
    when: () => false,   // wird im Reiter Teams ausgelöst, wo auch die Größe eingestellt wird
    title: "Teams neu auslosen",
    lead: "Die bestehenden Teams werden gelöscht und alle Teilnehmenden neu verteilt. Die bisherigen Team-Codes gelten dann nicht mehr.",
    keeps: "Teilnehmende und Stationen bleiben.",
    btn: "Neu auslosen",
    async run(c) {
      S.admin.state = await rpc("admin_draw", { p_pin: S.admin.pin, p_teams: c.p_teams ?? null, p_size: c.p_size ?? null });
      S.admin.tracks = null; S.admin.syncedAt = null; S.admin.hidden = {}; S.admin.tab = "teams";
      return "Neu ausgelost. Gib jeder Teamleitung ihren neuen Code.";
    }
  },
  reset: {
    when: st => st.status !== "registration",
    title: "Fortschritt zurücksetzen",
    lead: "Check-ins, gelöste Rätsel, Ziffern, Standortdaten und Routen aller Teams werden gelöscht. Danach steht das Spiel wieder vor dem Start.",
    keeps: "Teams, Teilnehmende und Stationen bleiben.",
    btn: "Fortschritt zurücksetzen",
    async run() {
      S.admin.state = await rpc("admin_reset", { p_pin: S.admin.pin });
      S.admin.tracks = null; S.admin.syncedAt = null; S.admin.cursor = null; stopPlay();
      return "Fortschritt gelöscht. Das Spiel steht wieder vor dem Start.";
    }
  },
  people: {
    when: st => (st.participants || []).length > 0,
    title: "Alle Teilnehmenden löschen",
    lead: st => `Alle ${(st.participants || []).length} angemeldeten Personen und alle Teams werden gelöscht, dazu Fortschritt und Standortdaten. Danach ist die Anmeldung wieder offen.`,
    keeps: "Stationen, Rätsel, Ziffern und die PIN bleiben.",
    btn: "Alle Teilnehmenden löschen",
    async run() {
      S.admin.state = await rpc("admin_clear_participants", { p_pin: S.admin.pin });
      S.admin.tracks = null; S.admin.syncedAt = null; S.admin.cursor = null; S.admin.hidden = {}; stopPlay();
      return "Alles geleert. Die Anmeldung ist wieder offen.";
    }
  },
  finish: {
    when: () => false,   // kommt über den Knopf oben, nicht als Kachel
    wort: false,
    title: "Spiel beenden",
    lead: "Danach nimmt die App keine Koffer-Codes mehr an. Teams, die noch unterwegs sind, kommen nicht mehr ins Ziel. Die Rangliste erscheint öffentlich.",
    keeps: "Plätze, Fortschritt und Routen bleiben erhalten.",
    btn: "Spiel beenden",
    async run() {
      S.admin.state = await rpc("admin_finish", { p_pin: S.admin.pin });
      S.admin.cursor = null; stopPlay();
      await syncTracks(true).catch(() => { });
      return "Spiel beendet. Die Routen bleiben, bis du die Standortdaten löschst.";
    }
  },
  person: {
    when: () => false,   // erscheint nicht als Kachel, nur über das × bei den Teilnehmenden
    wort: false,         // eine Person löscht man oft, da reicht die Rückfrage ohne Tippen
    title: "$NAME löschen",
    lead: "$NAME wird aus der Anmeldung entfernt.",
    keeps: "War die Person eine Teamleitung, wird im Team eine neue ausgelost.",
    btn: "Person löschen",
    async run(c) {
      S.admin.state = await rpc("admin_delete_participant", { p_pin: S.admin.pin, p_id: c.id });
      return c.name + " gelöscht.";
    }
  }
};
// Standard ist das getippte Wort, nur wer ausdrücklich wort:false setzt, kommt ohne aus
const brauchtWort = key => DANGER[key].wort !== false;
const fmtClock = ms => new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
function fmtDur(ms) {
  const m = Math.round(ms / 60000);
  return m < 60 ? m + " min" : Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + " h";
}
const FLAG = '<svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" fill="#fff" stroke="currentColor" stroke-width="1.2"/><polygon points="1,1 23,1 23,23" fill="var(--flag)"/></svg>';
// Hilfe per WhatsApp. Ohne Nummer in config.js erscheint kein Knopf.
const CHAT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.9 3 3 6.6 3 11c0 2.2 1 4.2 2.6 5.6L5 21l4.7-1.8c.7.2 1.5.3 2.3.3 5.1 0 9-3.6 9-8.5S17.1 3 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
function helpHref(text) {
  const s = (window.SJ_CONFIG || {}).support;
  const nr = s && s.phone ? String(s.phone).replace(/[^0-9]/g, "") : "";
  if (!nr) return null;
  return "https://wa.me/" + nr + (text ? "?text=" + encodeURIComponent(text) : "");
}
function helpBtn(text, klasse) {
  const href = helpHref(text);
  if (!href) return "";
  const name = ((window.SJ_CONFIG || {}).support || {}).name || "der Spielleitung";
  return `<a class="btn ${klasse || "alt"} help" href="${href}" target="_blank" rel="noopener">${CHAT}Hilfe von ${esc(name)}</a>`;
}
const brand = sub => `<div class="brand">${FLAG}<div><h1>Stadtjagd</h1><div class="muted small">${esc(sub)}</div></div></div>`;
const msgBox = () => {
  if (!S.msg) return "";
  S.msg.at = S.msg.at || Date.now();
  // Erfolgsmeldungen verschwinden nach einer Weile, sonst hängen sie noch an der nächsten Station
  if (S.msg.type === "ok" && Date.now() - S.msg.at > 12000) return "";
  return `<div class="msg ${S.msg.type}" role="status">${esc(S.msg.text)}</div>`;
};
// Die Spielleitung öffnet #/admin direkt, Teilnehmende sehen nur, was sie brauchen
const nav = () => `<div class="nav">${[["#/public", "Anmeldung"], ["#/team", "Teamleitung"]]
  .concat(S.view === "admin" ? [["#/admin", "Spielleitung"]] : [])
  .map(([h, t]) => `<a href="${h}">${t}</a>`).join("<span>|</span>")}</div>`;

/* ---------- Setup-Ansicht, falls nicht konfiguriert ---------- */
function viewSetup() {
  return brand("Einrichtung") + `<div class="panel">
    <h2>Mit Supabase verbinden</h2>
    <p class="muted small">Trag die Werte aus Supabase unter Project Settings, API ein. Für den Dauerbetrieb schreibst du sie oben in die Datei, dann entfällt dieser Schritt für alle anderen.</p>
    <div style="margin-top:12px"><label for="surl">Project URL</label><input id="surl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url)}"></div>
    <div style="margin-top:12px"><label for="skey">anon public key</label><input id="skey" value="${esc(cfg.key)}"></div>
    <button class="btn" data-act="cfg-save">Speichern</button>${msgBox()}</div>`;
}

/* ---------- Öffentliche Ansicht ---------- */
function viewPublic() {
  const p = S.pub;
  if (!p) return brand("Teamfahrt") + `<div class="panel"><p>Lade …</p>${msgBox()}</div>` + nav();
  let out = brand(p.status === "registration" ? "Anmeldung offen" : p.status === "finished" ? "Spiel beendet" : "Die Teams stehen");

  if (p.status === "registration") {
    out += S.myName
      ? `<div class="panel"><h2>Du bist dabei, ${esc(S.myName)}.</h2>
         <p>Sobald die Spielleitung auslost, siehst du hier dein Team.</p></div>
         <button class="btn alt" data-act="pub-again">Weitere Person anmelden</button>`
      : `<div class="panel"><h2>Mitmachen</h2><p class="muted">Trag deinen Namen ein. Die Teams werden später zufällig ausgelost.</p>
         <div style="margin-top:12px"><label for="pname">Vor- und Nachname</label><input id="pname" autocomplete="name" autocapitalize="words" enterkeyhint="send"></div>
         <button class="btn" data-act="pub-reg" ${S.busy ? "disabled" : ""}>Anmelden</button>${msgBox()}</div>`;
    out += `<div class="panel"><div class="count">${p.participantCount}</div><div class="muted small">Personen angemeldet</div></div>`;
    out += helpBtn("Stadtjagd: Ich komme bei der Anmeldung nicht weiter.");
    return out + nav();
  }

  const ziel = (p.ranking || []).filter(r => r.place), vorbei = p.status === "finished";
  if (vorbei || ziel.length) {
    const prizes = p.prizeCount ?? 3;
    out += `<div class="panel"><h2>${vorbei ? "Rangliste" : "Zieleinlauf"}</h2>
      ${vorbei ? "" : `<p class="small muted">Das Spiel läuft noch. Jedes Team erscheint hier, sobald es den Koffer-Code eingegeben hat.</p>`}
      <table><tr><th>Platz</th><th>Team</th><th>${vorbei ? "Stand" : "Im Ziel"}</th></tr>
      ${(vorbei ? p.ranking || [] : ziel).map(r => `<tr><td style="white-space:nowrap">${r.place ? platzZeichen(r.place, prizes) : "-"}</td>
        <td>${teamEmoji(r.teamName)} ${esc(r.teamName)}</td>
        <td style="white-space:nowrap">${r.place ? (vorbei ? "im Ziel " : "") + uhrzeit(r.finishedAt) : r.solved + " / " + p.stationCount}</td></tr>`).join("")}</table></div>`;
  }
  const t = S.lookup;
  if (t) out += `<div class="panel"><p class="muted small">${S.lookupEigen ? `Dein Team, ${esc(S.myName)}` : "Gefundenes Team"}</p><h2>${teamEmoji(t.name)} Team ${esc(t.name)}</h2>
    <p>Leitung: ${esc(t.leaderName || "offen")}</p>
    <ul class="names">${(t.members || []).map(m => `<li class="${m === t.leaderName ? "leader" : ""}">${esc(m)}</li>`).join("")}</ul></div>`;
  out += `<div class="panel"><label for="plook">In welchem Team bin ich?</label>
    <input id="plook" value="${esc(S.myName || "")}" autocapitalize="words" enterkeyhint="search">
    <button class="btn" data-act="pub-look">Team anzeigen</button>${msgBox()}
    ${S.kandidaten ? `<div class="wahl">${S.kandidaten.map(n => `<button class="btn sm alt" data-act="pub-look" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}</div>`;
  out += helpBtn("Stadtjagd: Ich finde mein Team nicht.");
  return out + nav();
}

/* ---------- Team-Ansicht ---------- */
function pauseText(bis) {
  const rest = Math.max(0, Math.ceil((new Date(bis).getTime() - Date.now()) / 1000));
  return `Denkpause: noch ${rest} ${rest === 1 ? "Sekunde" : "Sekunden"}. Danach habt ihr wieder drei Versuche.`;
}
function lockHTML(st, klein) {
  const d = st.digits || [];
  let h = '<div class="lock">';
  for (let k = 0; k < 6; k++) {
    const v = k < 5 ? d[k] : st.finalDigit;
    h += `<div class="wheel ${klein ? "klein" : ""} ${v == null ? "empty" : ""}">${v == null ? "?" : v}</div>`;
  }
  return h + "</div>";
}
function routeHTML(st) {
  let h = '<div class="route">';
  for (let k = 0; k < (st.totalStations || 5); k++) {
    if (k) h += `<i class="${k <= st.solvedCount ? "done" : ""}"></i>`;
    h += `<b class="${k < st.solvedCount ? "done" : k === st.solvedCount ? "now" : ""}">${k + 1}</b>`;
  }
  return h + "</div>";
}
const accText = a => a != null && a >= 0 ? `±${Math.round(a)}°` : "unbekannt";
function kompassText() {
  const g = S.gps, lauf = g.gpsHeading != null;
  if (g.heading != null) {
    if (g.kompass !== "kalibrieren")
      return "Kompass aktiv" + (g.kompassAcc != null && g.kompassAcc >= 0 ? ", " + accText(g.kompassAcc) : "");
    const wie = g.kompassAcc != null && g.kompassAcc >= 0 ? ` (${accText(g.kompassAcc)})` : "";

  }
  if (A.confirm) {
    const D = DANGER[A.confirm.key];
    const txt = (v) => {
      const roh = typeof v === "function" ? v(st) : v;
      return A.confirm.name ? roh.replace("$NAME", A.confirm.name) : roh;
    };
    const titel = txt(D.title), lead = txt(D.lead);
    out += `<div class="overlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgt">
      <h2 id="dlgt">${esc(titel)}</h2>
      <div class="why">${esc(lead)}</div>
      <p class="keeps">${esc(txt(D.keeps))}</p>
      ${brauchtWort(A.confirm.key) ? `<div style="margin-top:16px"><label for="dlgword">Tippe <b>${DANGER_WORD}</b>, um es wirklich zu löschen</label>
        <input id="dlgword" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>` : ""}
      <div class="row">
        <button class="btn alt" data-act="a-dlg-cancel">Abbrechen</button>
        <button class="btn warn" id="dlgok" data-act="a-dlg-ok" ${brauchtWort(A.confirm.key) ? "disabled" : ""}>${esc(D.btn)}</button>
      </div></div></div>`;
  }
  return out + nav();
}

  const v = parseInt($("#dval") ? $("#dval").value : S.admin.draw.value, 10);
  if (n < 2 || !v || v < 1) return null;
  return mode === "teams" ? { p_teams: v } : { p_size: v };
}
function drawPreview() {
  const el = $("#dprev"), st = S.admin.state;
  if (!el || !st) return;
  const n = (st.participants || []).length;
  const mode = $("#dmode") ? $("#dmode").value : S.admin.draw.mode;
  const roh = $("#dval") ? $("#dval").value : S.admin.draw.value;
  const v = parseInt(roh, 10);
  S.admin.draw = { mode, value: isNaN(v) ? roh : v };
  const lbl = $("#dvallabel"); if (lbl) lbl.textContent = mode === "teams" ? "Teams" : "Personen";
  if (n < 2) { el.textContent = " "; return; }
  if (!v || v < 1) { el.textContent = "Bitte eine Zahl größer als null eintragen."; return; }
  const max = Math.min(n, TEAM_MAX);
  let t = mode === "teams" ? v : Math.ceil(n / v);
  const geklemmt = t > max;
  t = Math.max(1, Math.min(t, max));
  const basis = Math.floor(n / t), rest = n % t;
  el.textContent = "Ergibt " + (rest === 0
    ? `${t} Team${t === 1 ? "" : "s"} mit je ${basis} ${basis === 1 ? "Person" : "Personen"}.`
    : `${t} Teams, ${rest} mit ${basis + 1} und ${t - rest} mit ${basis} Personen.`)
    + (geklemmt ? ` Mehr als ${max} Teams gehen nicht.` : "");
}

/* ---------- Karte ---------- */
let map = null, layers = { stations: [], teams: {} }, leafletReady = null;
function loadLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((res, rej) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload = res; js.onerror = () => rej(new Error("Karte konnte nicht geladen werden."));
    document.head.appendChild(js);
  });
  return leafletReady;
}
async function drawMap(first) {
  const el = $("#map"); if (!el || !S.admin.state) return;
  try { await loadLeaflet(); } catch (e) { el.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  const st = S.admin.state, A = S.admin, cur = A.cursor;
  if (!map || !el.contains(map.getContainer())) {
    map = L.map(el, { zoomControl: true }).setView([50.0875, 14.4180], 14);   // Prag, Altstadt
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    layers = { stations: [], teams: {}, tracks: {} };
    first = true;
  }
  layers.stations.forEach(l => map.removeLayer(l));
  layers.stations = [];
  const pts = [];
  (st.stations || []).forEach(s => {
    if (s.lat == null || s.lng == null) return;
    const icon = L.divIcon({ html: `<div class="mapbadge">${s.position}</div>`, className: "", iconSize: [28, 28], iconAnchor: [14, 14] });
    const m = L.marker([s.lat, s.lng], { icon, zIndexOffset: 1000 }).bindPopup(`<b>Station ${s.position}</b><br>${esc(s.name)}`);
    const c = L.circle([s.lat, s.lng], { radius: s.radiusM, color: "#EE5F1B", weight: 1, fillOpacity: .08 });
    m.addTo(map); c.addTo(map); layers.stations.push(m, c); pts.push([s.lat, s.lng]);
  });
  const drop = (store, id) => { if (store[id]) { map.removeLayer(store[id]); delete store[id]; } };
  // Punkte weit weg von der Route (etwa 0/0 eines Geräts ohne Fix) weder zeichnen noch in den Ausschnitt nehmen
  const anker = (st.stations || []).find(s => s.lat != null && s.lng != null);
  const nah = (lat, lng) => !anker || haversine({ lat, lng }, anker) < 30000;
  (st.teams || []).forEach((t, i) => {
    const color = teamColor(i), off = !!A.hidden[t.id];
    const tr = A.tracks && A.tracks[t.id];
    let line = tr ? tr.points : [];
    if (cur != null) line = line.filter(p => p[2] <= cur);
    line = line.filter(p => nah(p[0], p[1]));

    // gelaufene Route
    if (!off && line.length > 1) {
      const ll = line.map(p => [p[0], p[1]]);
      if (layers.tracks[t.id]) layers.tracks[t.id].setLatLngs(ll);
      else layers.tracks[t.id] = L.polyline(ll, { color, weight: 4, opacity: .85, lineJoin: "round" }).addTo(map);
      ll.forEach(p => pts.push(p));
    } else drop(layers.tracks, t.id);

    // aktueller Standort, beim Zurückspulen der letzte Punkt bis dahin
    let at = null, when = null;
    if (cur != null) {
      const last = line[line.length - 1];
      if (last) { at = [last[0], last[1]]; when = last[2]; }
    } else if (t.position) {
      at = [t.position.lat, t.position.lng]; when = new Date(t.position.updatedAt).getTime();
    }
    if (off || !at || !nah(at[0], at[1])) { drop(layers.teams, t.id); return; }
    const ref = cur != null ? cur : Date.now();
    const stale = ref - when > 180000;
    pts.push(at);
    const html = `<div class="mapbadge team ${stale ? "stale" : ""}" ${stale ? "" : `style="background:${color}"`}>${teamEmoji(t.name)}</div>`;
    const solved = cur != null
      ? ((tr && tr.stations) || []).filter(s => s.solvedAt && new Date(s.solvedAt).getTime() <= cur).length
      : t.solved;
    const popup = `<b>${esc(t.name)}</b><br>${esc(t.code)}<br>${solved} von ${(st.stations || []).length} gelöst<br>`
      + (stale ? "keine aktuelle Position" : "Position " + fmtClock(when) + " Uhr");
    const icon = L.divIcon({ html, className: "", iconSize: [28, 28], iconAnchor: [14, 14] });
    if (layers.teams[t.id]) {
      layers.teams[t.id].setLatLng(at); layers.teams[t.id].setIcon(icon); layers.teams[t.id].setPopupContent(popup);
    } else {
      layers.teams[t.id] = L.marker(at, { icon, zIndexOffset: 500 }).bindPopup(popup).addTo(map);
    }
  });
  if (first && pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
  setTimeout(() => map.invalidateSize(), 60);
}

/* ---------- Routen laden ---------- */
// Holt nur die Punkte seit dem letzten Abruf, sonst käme bei jedem Takt
// der komplette Verlauf über die Leitung.
async function syncTracks(full) {
  const A = S.admin;
  if (!A.pin) return;
  if (full) { A.tracks = null; A.syncedAt = null; }
  const r = await rpc("admin_tracks", A.syncedAt ? { p_pin: A.pin, p_since: A.syncedAt } : { p_pin: A.pin });
  if (!A.tracks) A.tracks = {};
  const keep = new Set(); let stale = false;
  (r.teams || []).forEach(t => {
    keep.add(t.id);
    const e = A.tracks[t.id] || (A.tracks[t.id] = { name: t.name, points: [], stations: [] });
    e.name = t.name; e.stations = t.stations || [];
    if (t.points && t.points.length) e.points = e.points.concat(t.points);
    // Wurden die Standortdaten zwischendurch gelöscht, haben wir zu viele Punkte
    if (t.pointCount != null && e.points.length > t.pointCount) stale = true;
  });
  Object.keys(A.tracks).forEach(id => { if (!keep.has(id)) delete A.tracks[id]; });
  A.syncedAt = r.now;
  A.window = {
    status: r.status,
    start: r.startedAt ? new Date(r.startedAt).getTime() : null,
    end: r.finishedAt ? new Date(r.finishedAt).getTime() : Date.now()
  };
  if (stale && !full) return syncTracks(true);
}

/* ---------- Zeitachse ---------- */
function timelineRows() {
  const A = S.admin, st = A.state, total = (st.stations || []).length;
  const list = (st.teams || []).map((t, i) => {
    const tr = A.tracks && A.tracks[t.id];
    const sts = (((tr && tr.stations) || [])).map(s => ({
      position: s.position,
      inAt: s.checkedInAt ? new Date(s.checkedInAt).getTime() : null,
      okAt: s.solvedAt ? new Date(s.solvedAt).getTime() : null
    })).filter(s => s.inAt).sort((a, b) => a.position - b.position);
    const okTimes = sts.filter(s => s.okAt).map(s => s.okAt);
    const solved = okTimes.length;
    return { t, color: teamColor(i), sts, solved, finish: total > 0 && solved === total ? Math.max(...okTimes) : null };
  });
  list.sort((a, b) => a.finish && b.finish ? a.finish - b.finish
    : a.finish ? -1 : b.finish ? 1
      : b.solved - a.solved || a.t.name.localeCompare(b.t.name, "de"));
  return list;
}
function renderTimeline() {
  const rows = $("#tlrows"); if (!rows) return;
  const A = S.admin, st = A.state, W = A.window;
  const span = $("#tlspan"), axis = $("#tlaxis"), slider = $("#tlslider");
  if (!W || !W.start) {
    rows.innerHTML = '<div class="tl-cursor" id="tlcursor" hidden></div>'
      + '<p class="small muted" style="padding:10px 0">Sobald das Spiel gestartet ist, entsteht hier für jedes Team eine Zeitleiste.</p>';
    if (span) span.textContent = "";
    if (axis) axis.innerHTML = "";
    if (slider) slider.disabled = true;
    return;
  }
  if (slider) slider.disabled = false;
  const start = W.start, end = Math.max(W.end, start + 60000), total = (st.stations || []).length;
  const pct = ms => (Math.min(Math.max(ms, start), end) - start) / (end - start) * 100;
  let html = '<div class="tl-cursor" id="tlcursor"></div>';
  timelineRows().forEach(r => {
    let segs = "", prev = start;
    r.sts.forEach(s => {
      segs += `<span class="seg" style="left:${pct(prev)}%;width:${pct(s.inAt) - pct(prev)}%"></span>`;
      const stop = s.okAt ?? end;
      segs += `<span class="seg solve" style="left:${pct(s.inAt)}%;width:${pct(stop) - pct(s.inAt)}%"></span>`;
      if (s.okAt) segs += `<i class="st" style="left:${pct(s.okAt)}%">${s.position}</i>`;
      prev = stop;
    });
    const last = r.sts[r.sts.length - 1];
    if (!r.finish && (!last || last.okAt)) segs += `<span class="seg" style="left:${pct(prev)}%;width:${pct(end) - pct(prev)}%;opacity:.5"></span>`;
    if (r.finish && r.t.place) {
      const bei = r.t.finishedAt ? new Date(r.t.finishedAt).getTime() : r.finish, pz = st.prizeCount ?? 3;
      segs += `<span class="win ${pct(bei) > 85 ? "links" : ""}" style="left:${pct(bei)}%" title="Platz ${r.t.place}">${r.t.place <= pz ? platzZeichen(r.t.place, pz) : "Platz " + r.t.place}</span>`;
    }
    const note = r.finish ? `${fmtDur(r.finish - start)}<small>${r.solved} Ziffern</small>`
      : `<small style="font-size:14px;color:var(--ink)">${W.status === "finished" ? "nicht fertig" : "unterwegs"}</small><small>${r.solved} von ${total} Ziffern</small>`;
    html += `<div class="tl-row ${A.hidden[r.t.id] ? "off" : ""}" data-act="a-team" data-id="${r.t.id}">
      <div class="tl-name"><i style="background:${r.color}"></i>${teamEmoji(r.t.name)} ${esc(r.t.name)}</div>
      <div class="tl-bar" style="--c:${r.color}">${segs}</div><div class="tl-total">${note}</div></div>`;
  });
  rows.innerHTML = html;
  if (axis) {
    const step = (end - start) > 3 * 3600e3 ? 3600e3 : (end - start) > 75 * 60e3 ? 30 * 60e3 : 15 * 60e3;
    let a = "";
    for (let ms = Math.ceil(start / step) * step; ms <= end; ms += step) a += `<span style="left:${pct(ms)}%">${fmtClock(ms)}</span>`;
    axis.innerHTML = a;
  }
  if (span) span.textContent = W.status === "finished"
    ? `Start ${fmtClock(start)}, Ende ${fmtClock(end)}, Dauer ${fmtDur(end - start)}`
    : `Start ${fmtClock(start)}, läuft seit ${fmtDur(end - start)}`;
  updateCursor();
}
function updateCursor() {
  const A = S.admin, W = A.window, c = $("#tlcursor"), clock = $("#tlclock"), slider = $("#tlslider");
  if (!W || !W.start) return;
  const start = W.start, end = Math.max(W.end, start + 60000);
  const at = A.cursor != null ? A.cursor : end;
  const f = (Math.min(Math.max(at, start), end) - start) / (end - start);
  if (c) { c.hidden = false; c.style.left = `calc(114px + (100% - 204px) * ${f})`; }
  if (clock) clock.textContent = fmtClock(at);
  if (slider && document.activeElement !== slider) slider.value = Math.round(f * 1000);
  const live = $("#tllive"); if (live) live.disabled = A.cursor == null;
}
function stopPlay() {
  S.admin.playing = false;
  const b = $("#tlplay"); if (b) b.textContent = "Abspielen";
}
function playStep(now) {
  const A = S.admin, W = A.window;
  if (!A.playing || !W || !W.start) return stopPlay();
  const end = Math.max(W.end, W.start + 60000);
  const dt = now - (A.lastTs || now); A.lastTs = now;
  A.cursor = Math.min(end, (A.cursor == null ? W.start : A.cursor) + dt * (end - W.start) / 45000);
  drawMap(false); updateCursor();
  if (A.cursor >= end) { A.cursor = null; stopPlay(); drawMap(false); updateCursor(); }
  else requestAnimationFrame(playStep);
}

/* ---------- GPS und Kompass ---------- */
let watchId = null, orientOn = false, raf = 0, kompassNeu = false;
const richtungBekannt = () => S.gps.heading != null || S.gps.gpsHeading != null;
const kompassDa = () => S.gps.kompass === "an" || S.gps.kompass === "kalibrieren";
// nur neu zeichnen, solange Kompass oder Einmessen zu sehen sind, sonst ginge
// eine halb getippte Rätselantwort verloren
const kompassSichtbar = () => !!($("#needle") || $("#kal") || $("#gstat"));

/* Einmessen: einmal pro Handy und Tag, Überspringen zählt auch.
   Messen können wir nur das Schwenken; iOS meldet zusätzlich die Genauigkeit. */
const KOMPASS_GRENZE = 25;   // Grad, darüber ist die Kompassrichtung nicht zu gebrauchen
const KAL_KEY = "sj.kal";
const KAL_MS = 5000;          // so lange muss geschwenkt werden
const KAL_MS_IOS = 2000;      // iOS: früher fertig, sobald die Genauigkeit stimmt
const KAL_GUT = 15;           // Grad, ab da gilt der iOS-Kompass als eingemessen
const KAL_SCHWENK = 80;       // Grad pro Sekunde, darunter ist es nur Zittern
const heute = () => new Date().toDateString();
const kalHeute = () => localStorage.getItem(KAL_KEY) === heute();
function kalStart() { S.gps.kal = { bewegt: 0, letzt: null }; S.gps.kalOk = null; }
function kalEnde(fertig) {
  const g = S.gps;
  g.kal = null;
  localStorage.setItem(KAL_KEY, heute());
  g.kalOk = fertig ? { acc: g.kompassAcc, bis: Date.now() + 8000 } : null;
}
// ein Orientierungsereignis auswerten; true, wenn das Einmessen damit fertig ist
function kalSchritt(e) {
  const k = S.gps.kal, t = e.timeStamp || performance.now();
  if (e.beta == null || e.gamma == null) return false;
  if (k.letzt) {
    const dt = t - k.letzt.t;
    if (dt > 0 && dt < 200) {
      const w = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
      if ((w(e.beta, k.letzt.b) + w(e.gamma, k.letzt.c)) / dt * 1000 > KAL_SCHWENK) k.bewegt += dt;
    }
  }
  k.letzt = { t, b: e.beta, c: e.gamma };
  const acc = S.gps.kompassAcc;
  const iosGut = acc != null && acc >= 0 && acc <= KAL_GUT && k.bewegt >= KAL_MS_IOS;
  if (k.bewegt >= KAL_MS || iosGut) { kalEnde(true); return true; }
  return false;
}
function kalZeigen() {
  const k = S.gps.kal; if (!k) return;
  const f = Math.min(1, k.bewegt / KAL_MS);
  const b = $("#kalfort"); if (b) b.style.width = Math.round(f * 100) + "%";
  const t = $("#kaltext"); if (t) t.textContent = kalText(f);
  const a = $("#kalacc"); if (a) a.textContent = accText(S.gps.kompassAcc);
}

function setNeedle(target) {
  const g = S.gps;
  g.needle += ((target - g.needle) % 360 + 540) % 360 - 180;
  const n = $("#needle");
  if (n) { n.style.transition = "transform .25s linear"; n.style.transform = `rotate(${g.needle}deg)`; }
}
// Woher die Blickrichtung kommt. Ein unsicherer Kompass ist schlechter als
// die Richtung, in die das Team tatsächlich läuft.
function richtung() {
  const g = S.gps;
  if (g.heading != null && g.kompass === "an") return g.heading;
  if (g.gpsHeading != null) return g.gpsHeading;
  return g.heading ?? 0;
}
function liveUpdate() {
  const g = S.gps, st = S.team.state, s = st && st.station;
  kalZeigen();
  const note = $("#gnote"); if (note && s && s.lat != null) note.textContent = gpsNote();
  const n = $("#needle"); if (n) n.closest(".compass").classList.toggle("unsicher", !richtungBekannt());
  const gs = $("#gstat"); if (gs) gs.textContent = gpsNote();
  if (!g.pos || !s || s.lat == null) return;
  const t = { lat: s.lat, lng: s.lng };
  const d = $("#dist"); if (d) d.textContent = fmtDist(haversine(g.pos, t));
  setNeedle(bearingTo(g.pos, t) - richtung());
}
function addOrient() {
  if (orientOn) return; orientOn = true;
  const h = e => {
    const g = S.gps;
    const vorher = g.kompass + (g.heading == null);
    let hd = null;
    const wch = e.webkitCompassHeading;          // nur iOS, schon auf Norden bezogen
    if (typeof wch === "number") {
      hd = wch;
      // iOS: Genauigkeit in Grad, negativ heißt nicht kalibriert. Ein großer positiver
      // Wert ist genauso unbrauchbar: gemessen auf einem iPhone 17 Pro ±74°, der Pfeil
      // lag um einen Viertelkreis daneben. Zurück auf "an" erst 5° unter der Grenze,
      // damit Hinweis und Knopf nicht an der Grenze flackern.
      const acc = e.webkitCompassAccuracy;
      g.kompassAcc = typeof acc === "number" ? acc : null;
      if (typeof acc !== "number") g.kompass = "an";
      else if (acc < 0 || acc > KOMPASS_GRENZE) g.kompass = "kalibrieren";
      else if (acc <= KOMPASS_GRENZE - 5 || g.kompass !== "kalibrieren") g.kompass = "an";
    } else if (e.absolute && e.alpha != null) {
      hd = 360 - e.alpha; g.kompass = "an";
    } else if (wch === null) {
      // iOS: Ereignis kommt an, aber ohne Nordbezug, Magnetsensor nicht kalibriert
      g.kompass = "kalibrieren";
    } else if (e.alpha != null) {
      // andere Geräte: Drehung nur relativ zum Startpunkt, taugt nicht für Norden
      g.kompass = "relativ";
    }
    if (hd == null) g.heading = null;
    else {
      const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      g.heading = (hd + so + 360) % 360;
    }
    // Einmessen: läuft es, zählt jedes Ereignis mit; sonst beim ersten echten
    // Kompass des Tages von selbst anbieten
    let kalWechsel = false;
    if (g.kal) kalWechsel = kalSchritt(e);
    else if (kompassDa() && !kalHeute() && ($("#needle") || $("#gstat"))) { kalStart(); kalWechsel = true; }
    // Hinweise und Knöpfe hängen am Zustand: bei einem Wechsel neu zeichnen
    if (kalWechsel || g.kompass + (g.heading == null) !== vorher) kompassNeu = true;
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      if (kompassNeu && kompassSichtbar()) { kompassNeu = false; render(); } else liveUpdate();
    });
  };
  if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", h);
  else window.addEventListener("deviceorientation", h);
}
async function startGps() {
  const g = S.gps;
  if (!navigator.geolocation) { g.err = "Dieses Gerät liefert keinen Standort."; render(); return; }
  try {
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) g.kompass = "fehlt";
    else if (typeof DOE.requestPermission === "function") {
      // iOS: muss aus einem Fingertipp kommen, sonst wird abgelehnt
      const r = await DOE.requestPermission();
      if (r === "granted") { g.kompass = "wartet"; addOrient(); }
      else g.kompass = "abgelehnt";
    } else { g.kompass = "wartet"; addOrient(); }
  } catch { g.kompass = "abgelehnt"; }
  // Handys ohne Magnetsensor schweigen einfach oder schicken leere Ereignisse.
  // Kommt in 3 s nichts Brauchbares, gilt der Kompass als fehlend; meldet er sich
  // später doch noch, setzt der Handler ihn wieder auf "an".
  if (g.kompass === "wartet") setTimeout(() => {
    if (g.kompass !== "wartet") return;
    g.kompass = "fehlt";
    if (kompassSichtbar()) render();
  }, 3000);
  g.on = true; g.err = null;
  if (watchId != null) navigator.geolocation.clearWatch(watchId);   // kein zweiter Beobachter
  let last = null;
  watchId = navigator.geolocation.watchPosition(p => {
    if (!brauchbar(p.coords)) return;
    const next = { lat: p.coords.latitude, lng: p.coords.longitude };
    // Laufrichtung auch dann mitrechnen, wenn der Kompass zwar etwas liefert,
    // aber zu ungenau ist. Sonst gibt es keinen Ersatz, wenn er ausfällt.
    if (last && haversine(last, next) > 6 && S.gps.kompass !== "an") S.gps.gpsHeading = bearingTo(last, next);
    last = next;
    const firstFix = !S.gps.pos;
    S.gps.pos = next; S.gps.acc = p.coords.accuracy ?? 999; S.gps.err = null;
    maybeReport();
    if (firstFix) render(); else liveUpdate();
  }, e => {
    if (e.code === 3) {
      // Ohne je einen Standort liegt es meist an der Erlaubnis, nicht am Signal
      S.gps.err = S.gps.pos ? "GPS-Signal ist schwach, die App sucht weiter."
        : "Noch kein Standort. Hat das Handy nach der Erlaubnis gefragt? Dann „Erlauben“ tippen. Die App sucht weiter.";
      render(); return;
    }
    S.gps.err = e.code === 1 ? "Standortzugriff wurde abgelehnt. Erlaube ihn in den Browser-Einstellungen." : "Standort nicht verfügbar.";
    render();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  render();
}
// Manche Geräte melden ohne Fix 0/0 oder Genauigkeit 0; solche Punkte verwerfen
const brauchbar = c => c && c.accuracy > 0 && c.accuracy <= 1000
  && !(Math.abs(c.latitude) < 0.01 && Math.abs(c.longitude) < 0.01);
function stopGps() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; S.gps.on = false; S.gps.pos = null; S.gps.kal = null;
}
function freshPosition() {
  return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy ?? 999 }),
    e => rej(new Error(e.message || "Standort nicht verfügbar.")),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }));
}
async function maybeReport() {
  const g = S.gps, st = S.team.state;
  if (!st || st.status !== "running" || !S.team.code || !g.pos) return;
  const moved = !g.lastSentPos || haversine(g.lastSentPos, g.pos) > 20;
  const oldEnough = Date.now() - g.lastSent > 60000;
  if (!moved && !oldEnough) return;
  g.lastSent = Date.now(); g.lastSentPos = { ...g.pos };
  try {
    await rpc("report_position", { p_code: S.team.code, p_lat: g.pos.lat, p_lng: g.pos.lng, p_acc: g.acc });
    g.sentAt = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch { /* Funkloch: beim nächsten Mal erneut */ }
}

/* ---------- Laden und Rendern ---------- */
// Nach dem Auslosen gleich das eigene Team zeigen: der Name ist von der Anmeldung bekannt
async function eigenesTeam() {
  if (!S.pub || S.pub.status === "registration" || !S.myName || S.lookup || S.autoLook) return;
  S.autoLook = true;
  try {
    const r = await rpc("lookup_participant", { p_name: S.myName });
    if (r.found && r.team) { S.lookup = r.team; S.lookupEigen = true; }
  } catch { /* dann eben per Hand suchen */ }
}
async function refresh() {
  if (!cfg.url || !cfg.key) return render();
  try {
    if (S.view === "public") { S.pub = await rpc("public_state", {}); await eigenesTeam(); }
    if (S.view === "team" && S.team.code) S.team.state = await rpc("team_state", { p_code: S.team.code });
    if (S.view === "admin" && S.admin.pin) S.admin.state = await rpc("admin_state", { p_pin: S.admin.pin });
  } catch (e) {
    if (String(e.message).includes("Unbekannter Team-Code")) { S.team.code = null; localStorage.removeItem("sj.code"); }
    if (String(e.message).includes("Falsche PIN")) { S.admin.pin = null; sessionStorage.removeItem("sj.pin"); }
    S.msg = { type: "err", text: e.message };
  }
  render();
}
function render() {
  const app = $("#app");
  app.className = S.view === "admin" && S.admin.pin ? "wide" : "";
  app.innerHTML = (!cfg.url || !cfg.key) ? viewSetup()
    : S.view === "team" ? viewTeam()
      : S.view === "admin" ? viewAdmin() : viewPublic();
  if (S.view === "admin" && S.admin.pin && S.admin.tab === "map") {
    drawMap(true); renderTimeline();
    syncTracks().then(() => { drawMap(false); renderTimeline(); }).catch(() => { });
  }
  if (S.view === "team") liveUpdate();
  if (S.admin.confirm) ($("#dlgword") || $("#dlgok"))?.focus();
  if (S.view === "admin" && S.admin.tab === "teams") drawPreview();
}
// Zeitachse: Schieber zieht den Zeitpunkt, ganz rechts heißt "jetzt"
document.addEventListener("input", e => {
  // Löschdialog: der Knopf wird erst scharf, wenn das Wort stimmt
  if (e.target.id === "dlgword") {
    const ok = $("#dlgok"); if (ok) ok.disabled = !wordOk(e.target.value);
    return;
  }
  if (e.target.id === "dval" || e.target.id === "dmode") { drawPreview(); return; }
  if (e.target.id === "asuche") {
    // filtern ohne neu zu zeichnen, sonst springt der Fokus aus dem Feld
    S.admin.suche = e.target.value.trim();
    document.querySelectorAll(".names li[data-such]").forEach(li => {
      li.hidden = !!S.admin.suche && !li.dataset.such.includes(S.admin.suche.toLowerCase());
    });
    return;
  }

  if (e.target.id !== "tlslider") return;
  const A = S.admin, W = A.window;
  if (!W || !W.start) return;
  stopPlay();
  const end = Math.max(W.end, W.start + 60000), v = Number(e.target.value) / 1000;
  A.cursor = v >= 1 ? null : W.start + (end - W.start) * v;
  drawMap(false); updateCursor();
});
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]");
  if (!a || a.disabled) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  S.busy = true;
  a.disabled = true;
  // Geht etwas schief, soll das Getippte stehen bleiben, statt mit dem Neuzeichnen zu verschwinden
  const getippt = {};
  document.querySelectorAll("#app input[id], #app textarea[id]").forEach(el => { getippt[el.id] = el.value; });
  const zurueck = () => {
    if (!S.msg || S.msg.type !== "err") return;
    Object.keys(getippt).forEach(id => { const el = document.getElementById(id); if (el && !el.disabled) el.value = getippt[id]; });
  };
  try {
    const r = await fn(a.dataset);
    S.busy = false;
    if (r !== false) { render(); zurueck(); } else a.disabled = false;
  } catch (err) {
    S.busy = false;
    S.msg = { type: "err", text: err.message || "Etwas ist schiefgelaufen." };
    render(); zurueck();
  }
});
document.addEventListener("change", e => { if (e.target.id === "dmode") drawPreview(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.admin.confirm) { S.admin.confirm = null; render(); return; }
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  if (e.target.id === "dlgword") { const ok = $("#dlgok"); if (ok && !ok.disabled) ok.click(); return; }
  const box = e.target.closest(".stack") || e.target.closest(".panel");
  const btn = box && box.querySelector(".btn[data-act]");
  if (btn && !btn.disabled) btn.click();
});
window.addEventListener("hashchange", () => {

  if (new Date(p.dataset.bis).getTime() <= Date.now()) render(); else p.textContent = pauseText(p.dataset.bis);
}, 1000);
setInterval(() => {
  if (document.hidden) return;
  const busyTyping = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
  if (S.view === "admin" && S.admin.pin) {
    rpc("admin_state", { p_pin: S.admin.pin }).then(s => {
      S.admin.state = s;
      if (S.admin.tab === "map") syncTracks().then(() => { drawMap(false); renderTimeline(); }).catch(() => { });
      else if (!busyTyping && !S.admin.edit && !S.admin.confirm) render();
    }).catch(() => { });
    return;
  }
  if (busyTyping) return;
  if (S.view === "team" && S.team.code) rpc("team_state", { p_code: S.team.code }).then(s => { S.team.state = s; render(); }).catch(() => { });
  if (S.view === "public") rpc("public_state", {}).then(async s => { S.pub = s; await eigenesTeam(); render(); }).catch(() => { });
}, 10000);
refresh();
</script>
</body>
</html>
