<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Geräte-Test</title>
<style>
/* QR-Code zum Verschicken des Geräte-Tests. Immer dunkel auf Weiß, sonst liest ihn keine Kamera. */
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F1F5EE;font:17px/1.5 system-ui,sans-serif;color:#17302A}
.karte{background:#fff;border:1px solid #D3DECF;border-radius:14px;padding:24px;text-align:center}
#qr svg{width:320px;height:320px;display:block}
p{margin:12px 0 0;font-size:15px;white-space:nowrap}
</style>
</head>
<body>
<div class="karte"><div id="qr"></div><p>7deeda.github.io/Stadtjagt/geraete-test.html</p></div>
<script src="../vendor/qrcode.js"></script>
<script>
const q = qrcode(0, "M"); q.addData("https://7deeda.github.io/Stadtjagt/geraete-test.html"); q.make();
document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
</script>
</body>
</html>
