<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadtjagd Rückblick v2 (Mockup)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<script>try { const t = localStorage.getItem("sj.thema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* Mockup v2 der Rückblick-Show: neue Finale-Choreografie und abgesicherte Steuerung nach
   docs/superpowers/specs/2026-10-17-rueckblick-kritik.md. Spezifikation: docs/superpowers/specs/2026-10-15-rueckblick-show-design.md
   Token wie index.html (design-system/MASTER.md); dazu die Bühnenstufen --bs-* und die Kartenfarben,
   die nur die Show braucht (Abweichungen, siehe Spezifikation Abschnitt 4). */
:root{
  --paper:#F1F5EE; --card:#FFFFFF; --ink:#17302A; --muted:#5B6F68; --line:#D3DECF; --feld:#7D9189;
  --contour:#CFDBC8; --flag:#EE5F1B; --flag-ink:#0F1B18; --flag-text:#C2410C; --water:#2F6E9E;
  --ok:#25683F; --ok-bg:#E3F1E7; --warn:#8A5A00; --warn-bg:#FBF0D9;
  --park:#DFEAD6; --strasse:#FFFFFF; --strasse-rand:#D3DECF; --fluss:#C9DDEA; --flaeche:#E6EBE2;
  --haus:#E2E8DD; --haus-rand:#D6DED0; --gruen:#E6EEDF;
  --anon:#3E5A52; --anon-linie:#3E5A52;
  --head:'Barlow Semi Condensed', 'Arial Narrow', sans-serif; --body:'Barlow', Arial, sans-serif;
  --emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  /* Bühnenstufen, gemessen auf der 1920er Bühne; bei 1280x720 zwei Drittel davon */
  --bs-xs:30px; --bs-s:36px; --bs-m:48px; --bs-l:72px; --bs-xl:120px; --bs-uhr:168px; --bs-titel:200px;
  --kurve:cubic-bezier(.32,.72,.4,1);
  --schatten:0 12px 32px rgba(17,17,17,.28), 0 2px 6px rgba(17,17,17,.12);
  --ring:var(--card);   /* Ring um Köpfe und Marken; im Dunkeln hell (S18) */
  color-scheme: light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B18; --card:#16261F; --ink:#E4EEE8; --muted:#9BB1A9; --line:#2A3F38; --feld:#5E786F;
    --contour:#1C312B; --flag:#FF7A3A; --flag-ink:#0F1B18; --flag-text:#FF7A3A; --water:#6FA8D6;
    --ok:#6CCB8E; --ok-bg:#16332A; --warn:#E8B75A; --warn-bg:#33290F;
    --park:#13261F; --strasse:#22362F; --strasse-rand:#1B2D27; --fluss:#16303F; --flaeche:#14231E;
    --haus:#152520; --haus-rand:#1A2C26; --gruen:#122219;
  --anon:#5E786F; --anon-linie:#9BB1A9;
    --anon:#5E786F; --anon-linie:#9BB1A9; --ring:var(--ink);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B18; --card:#16261F; --ink:#E4EEE8; --muted:#9BB1A9; --line:#2A3F38; --feld:#5E786F;
  --contour:#1C312B; --flag:#FF7A3A; --flag-ink:#0F1B18; --flag-text:#FF7A3A; --water:#6FA8D6;
  --ok:#6CCB8E; --ok-bg:#16332A; --warn:#E8B75A; --warn-bg:#33290F;
  --park:#13261F; --strasse:#22362F; --strasse-rand:#1B2D27; --fluss:#16303F; --flaeche:#14231E;
  --haus:#152520; --haus-rand:#1A2C26; --gruen:#122219; --ring:var(--ink);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
body.still{cursor:none}
.nw{white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}
.emo{font-family:var(--emoji);font-style:normal}

/* ---------- Bühne: 1920x1080, skaliert auf jedes 16:9-Fenster ---------- */
#buehne{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
#welt,#schirm{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#buehne[data-art=titel] #stationen,#buehne[data-art=titel] #namen,#buehne[data-art=vorbereiten] #stationen,
#buehne[data-art=fakten] #stationen,#buehne[data-art=fakten] #namen,#buehne[data-art=gruppen] #stationen,#buehne[data-art=gruppen] #namen,
#buehne[data-art=rangliste] #stationen,#buehne[data-art=rangliste] #namen,#buehne[data-art=spalten] #stationen,#buehne[data-art=spalten] #namen,
#buehne[data-art=sieger] #stationen,#buehne[data-art=sieger] #namen{display:none}
#buehne[data-art=titel] .radius{display:none}
#welt .hoehe{fill:none;stroke:var(--contour);stroke-width:1.6;vector-effect:non-scaling-stroke}
#welt .park{fill:var(--park)}
#welt .gruen{fill:var(--gruen)}
#welt .wasser{fill:var(--fluss)}
#welt .gebaeude{fill:var(--haus);stroke:var(--haus-rand);stroke-width:.8;vector-effect:non-scaling-stroke}
#welt .bahn{fill:none;stroke:var(--feld);stroke-width:2;stroke-dasharray:10 6;opacity:.6;vector-effect:non-scaling-stroke}
#welt .flusslinie{fill:none;stroke:var(--fluss);stroke-width:4;vector-effect:non-scaling-stroke}
.osm{position:absolute;right:24px;bottom:calc(var(--unten, 0px) + 10px);z-index:4;font:500 18px var(--body);color:var(--muted);opacity:.8;pointer-events:none}
#welt .flaeche{fill:var(--flaeche)}
#welt .fluss{fill:none;stroke:var(--fluss);stroke-linecap:round;stroke-linejoin:round}
#welt .strasse-r{fill:none;stroke:var(--strasse-rand);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#welt .strasse{fill:none;stroke:var(--strasse);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#welt .neben{fill:none;stroke:var(--strasse);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
#welt .weg{fill:none;stroke:var(--feld);stroke-width:1.6;stroke-dasharray:6 7;opacity:.55;vector-effect:non-scaling-stroke}
#welt .radius{fill:var(--flag);fill-opacity:.09;stroke:var(--flag);stroke-width:2;stroke-opacity:.7;vector-effect:non-scaling-stroke}
#welt .rand{fill:none;stroke:var(--card);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85;vector-effect:non-scaling-stroke}   /* stroke-opacity: opacity je Pfad kostete im Zeitraffer 15 fps */
#welt .spur{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#welt .luecke{fill:none;stroke-width:4;stroke-dasharray:10 10;stroke-linecap:round;vector-effect:non-scaling-stroke}
#schirm text{font-family:var(--head);font-weight:700}
#schirm .ortsname{font:600 var(--bs-xs) var(--body);font-style:italic;fill:var(--muted);opacity:.75}
#schirm .flussname{font:600 var(--bs-xs) var(--body);font-style:italic;fill:var(--water);opacity:.85}
#schirm .stnr{font-size:32px;fill:var(--flag-ink)}
#schirm .stbadge{fill:var(--flag);stroke:var(--ring);stroke-width:4}
#schirm .startbadge{fill:var(--ink);stroke:var(--ring);stroke-width:4}
#schirm .haus{fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#schirm .kopf circle.k{stroke:var(--ring);stroke-width:5}
#schirm .kopf circle.ohne{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:6 5}
#schirm .kopf text{font-family:var(--emoji);font-size:34px;font-weight:400}
#schirm .kopf .frage{display:none;font:700 38px var(--head);fill:var(--paper)}
/* Zeitraffer anonym (17.10.): wer führt, soll erst die Siegerehrung zeigen. Alle Köpfe gleich mit "?", alle Routen in
   einer Farbe; Teamfarben und Tiere erst bei den Plätzen, im Abspann und im Schlussbild */
#buehne[data-art="karte"] #schirm .kopf circle.k{fill:var(--anon)}
#buehne[data-art="karte"] #schirm .kopf .tier{display:none}
#buehne[data-art="karte"] #schirm .kopf .frage{display:block}
#buehne[data-art="karte"] #welt .spur,#buehne[data-art="karte"] #welt .luecke{stroke:var(--anon-linie);stroke-opacity:.5}

#pulse .kpuls{fill:none;stroke:var(--flag);stroke-width:5}
#schirm .puls{fill:none;stroke-width:5}
#schirm .lueckenhinweis{font:500 var(--bs-xs) var(--body);fill:var(--muted)}

/* ---------- Zeitraffer (Nachtrag 17.10.): ein Kapitel, oben Laufzeit und "im Ziel", keine Seitenleiste ---------- */
.zr-kopf{position:absolute;left:50%;top:28px;transform:translateX(-50%);display:flex;align-items:center;gap:48px;padding:16px 44px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 12px rgba(17,17,17,.08);white-space:nowrap}
.zr-kopf small{display:block;font:600 var(--bs-xs)/1 var(--head);color:var(--muted)}
.zr-kopf b{display:block;font:700 var(--bs-l)/1 var(--head);font-variant-numeric:tabular-nums;margin-top:8px}
.zr-kopf b em{font-style:normal}
.zr-kopf b span{font-size:var(--bs-s);color:var(--muted);margin-left:10px}
.zr-kopf > i{width:2px;align-self:stretch;background:var(--line)}

/* Fun Facts: drei Zahlen nebeneinander, mittig mit gleichem Abstand, die hochzählen */
.ff-kopf{position:absolute;left:0;right:0;text-align:center;font:700 var(--bs-l)/1 var(--head)}
.ff-netz{position:absolute;left:72px;right:72px;display:grid;grid-template-columns:repeat(3,minmax(0,480px));justify-content:center;gap:96px}
.ff-netz > div{display:flex;flex-direction:column;align-items:center;text-align:center;will-change:transform,opacity}
.ff-netz .emo{font-size:112px;line-height:1}
.ff-netz b{font:700 var(--bs-xl)/1 var(--head);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:28px}
.ff-netz .ff-lbl{font:600 var(--bs-s)/1.15 var(--head);margin-top:14px;text-wrap:balance}
/* Kalorien: zwei Lagen in einer Kachel (erst halbe Brathähnchen, dann Liter Bier), weich überblendet */
.ff-lagen{display:grid;justify-items:center;align-items:start;align-self:stretch}
.ff-lage{grid-area:1/1;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.ff-netz small{font:500 var(--bs-xs)/1.2 var(--body);color:var(--muted);margin-top:8px;white-space:nowrap}

/* Die Gruppen: Startgruppen nebeneinander, die Teams je Gruppe sichtbar (Tier, Farbe, Name); im Zeitraffer bleiben die Köpfe anonym */
.gr-netz{position:absolute;left:96px;right:96px;display:flex;justify-content:center;gap:48px}
.gr-spalte{flex:1;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 40px 40px;will-change:transform,opacity}
.gr-spalte h3{font:700 var(--bs-l)/1 var(--head);margin:0;white-space:nowrap}
.gr-spalte .zeit{font:600 var(--bs-m)/1 var(--head);margin-top:16px;white-space:nowrap}
.gr-spalte .leute{font:500 var(--bs-s)/1 var(--body);color:var(--muted);margin-top:12px;white-space:nowrap}
.gr-koepfe{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.gr-team{display:flex;align-items:center;gap:18px;font:700 var(--bs-s)/1 var(--head);white-space:nowrap;min-width:0}
.gr-team i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:38px/1 var(--emoji);flex:none;border:4px solid var(--ring)}
.anon{width:88px;height:88px;border-radius:50%;background:var(--anon);color:var(--paper);display:grid;place-items:center;font:700 48px/1 var(--head);border:5px solid var(--ring);flex:none}

/* ---------- Szenen über der Karte ---------- */
.szene{position:absolute;inset:0;opacity:0}
.schleier{position:absolute;inset:0;background:color-mix(in srgb, var(--paper) 72%, transparent)}
.schleier.mittel{background:color-mix(in srgb, var(--paper) 82%, transparent)}
.schleier.dicht{background:color-mix(in srgb, var(--paper) 93%, transparent)}

/* Vorspann */
.titel{position:absolute;left:0;right:0;top:250px;text-align:center}
.titel .logo{width:150px;height:150px;margin:0 auto;color:var(--ink)}
.titel h1{font:700 var(--bs-titel)/.95 var(--head);margin:28px 0 0;letter-spacing:-.01em}
.titel .ort{font:700 var(--bs-xl)/1 var(--head);color:var(--flag-text);margin-top:4px}
/* Teile mit Abstand statt Trennzeichen (kein Mittelpunkt, Entscheidung Friedrich) */
.titel .fakten{font:500 var(--bs-m) var(--body);color:var(--muted);margin-top:44px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:56px;row-gap:8px}
.titel .fakten span{white-space:nowrap}

/* Fotos einer Station */
.f-kopf{position:absolute;left:80px;right:80px;top:64px;display:flex;align-items:center;gap:28px}
.f-kopf .nr{width:104px;height:104px;border-radius:50%;background:var(--flag);color:var(--flag-ink);display:grid;place-items:center;font:700 64px var(--head);flex:none}
.f-kopf h2{font:700 var(--bs-l)/1 var(--head);margin:0}
.f-kopf .sub{font:500 var(--bs-s) var(--body);color:var(--muted);margin-top:6px}
.f-kopf .zuerst{margin-left:auto;text-align:right}
.f-kopf .zuerst small{display:block;font:500 var(--bs-xs) var(--body);color:var(--muted)}
.f-kopf .zuerst b{font:700 var(--bs-m) var(--head);white-space:nowrap}
.kachel{position:absolute;left:0;top:0;width:540px;height:720px;transform-origin:0 0;border-radius:8px;overflow:hidden;background:var(--card);will-change:transform}
.kachel img{width:100%;height:100%;object-fit:cover;display:block}
.kachel.gross{box-shadow:var(--schatten)}
/* Unter der Kachel nur Tier und Name (S2: Uhrzeit nur im großen Spot) */
.unterschrift{position:absolute;display:grid;grid-template-columns:14px auto minmax(0,1fr);column-gap:10px;align-items:center;font:600 var(--bs-xs)/1 var(--head);white-space:nowrap}
.unterschrift i{width:14px;height:40px;border-radius:3px}
.unterschrift .nm{overflow:hidden;text-overflow:ellipsis}
.spot{position:absolute;left:50%;top:948px;transform:translateX(-50%);z-index:6;padding:10px 28px;border-radius:12px;background:var(--card);box-shadow:var(--schatten);font:700 var(--bs-m) var(--head);white-space:nowrap}
.spot .zt{color:var(--muted);font-weight:500;margin-left:16px;font-variant-numeric:tabular-nums}

/* Rangliste von unten: alle Plätze untereinander, Zeiten auf Walzen; von unten nach oben rastet je Platz die Zeit ein
   und "?" wird zum Team, bis Platz 4. Alle Maße hängen an --zh (Zeilenhöhe), rangHTML() setzt sie nach der Teamzahl */
.rl-kopf{position:absolute;left:260px;top:44px;font:700 var(--bs-l)/1 var(--head)}
.rl-netz{position:absolute;left:260px;right:260px;display:flex;flex-direction:column;will-change:opacity}
.rl-zeile{height:var(--zh);display:grid;grid-template-columns:calc(var(--zh) * 1.5) calc(var(--zh) * 1.05) minmax(0,1fr) auto;column-gap:calc(var(--zh) * .3);align-items:center;border-bottom:1px solid var(--line);padding:0 calc(var(--zh) * .2)}
.rl-zeile .r{font:700 calc(var(--zh) * .55)/1 var(--head);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-zeile .r .emo{font-size:calc(var(--zh) * .7)}
.rl-kreis{position:relative;width:calc(var(--zh) * .82);height:calc(var(--zh) * .82)}
.rl-kreis > *{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center}
.rl-kreis .fr{background:var(--anon);color:var(--paper);font:700 calc(var(--zh) * .46)/1 var(--head)}
.rl-kreis .ti{font:calc(var(--zh) * .48)/1 var(--emoji);border:3px solid var(--ring);opacity:0}
.rl-zeile .n{font:700 calc(var(--zh) * .56)/1.15 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
.rl-zeile .n small{font:500 calc(var(--zh) * .36) var(--body);color:var(--muted);margin-left:18px}
.rl-zeile .weg{font:500 calc(var(--zh) * .36)/1 var(--body);color:var(--muted);white-space:nowrap}
.mw{display:flex;align-items:center;gap:calc(var(--zh) * .08)}
.mw .walze{width:calc(var(--zh) * .56);height:calc(var(--zh) * .8);border-radius:4px;background:var(--ink);overflow:hidden;position:relative}
.mw .band{position:absolute;left:0;right:0;top:0;will-change:transform}
.mw .band div{height:calc(var(--zh) * .8);display:grid;place-items:center;font:700 calc(var(--zh) * .6)/1 var(--head);color:var(--paper);font-variant-numeric:tabular-nums}
.mw .walze::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--ink),transparent 25%,transparent 75%,var(--ink));opacity:.5}
.mw .dp{font:700 calc(var(--zh) * .5)/1 var(--head);color:var(--muted)}

/* Drei Spalten: Platz 2, 1, 3 nebeneinander wie das Podest, je Zeit und der Weg des Teams zum Vergleich (anonym);
   aufgedeckt wird in der eigenen Spalte (Platz 3, Platz 2, zuletzt Platz 1 eskaliert) */
.sp-netz{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:48px}
.sp-spalte{width:540px;position:relative;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.sp-platz{font:700 var(--bs-l)/1 var(--head);display:flex;align-items:center;gap:16px;white-space:nowrap}
.sp-platz .emo{font-size:72px}
.sp-zeit{font:700 var(--bs-l)/1 var(--head);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:14px}
.sp-karte{width:540px;height:290px;margin-top:22px;border-radius:8px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.sp-karte svg{display:block;width:100%;height:100%}
.sp-karte .grau{fill:none;stroke:var(--anon-linie);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.sp-karte .farbe{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sp-karte .st{fill:var(--flag);stroke:var(--ring);stroke-width:2}
.sp-karte .start{fill:var(--ink);stroke:var(--ring);stroke-width:2}
.sp-karte text{font:700 15px var(--head);text-anchor:middle;fill:var(--flag-ink)}
.sp-karte .kf{fill:var(--anon);stroke:var(--ring);stroke-width:3}
.sp-karte .kfr{font-size:22px;fill:var(--paper)}
.sp-karte .kti{font:20px var(--emoji)}
.sp-team{display:flex;align-items:center;gap:24px;margin-top:24px;align-self:stretch;min-height:128px;min-width:0}
.sp-kreis{position:relative;width:128px;height:128px;flex:none}
.sp-kreis > div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center}
.sp-kreis .fr{background:var(--anon);color:var(--paper);font:700 72px/1 var(--head);border:6px solid var(--ring)}
.sp-kreis .ti{font:76px/1 var(--emoji);border:6px solid var(--ring);box-shadow:0 0 0 1px var(--line);opacity:0}
.sp-ring{position:absolute;inset:0;border-radius:50%;border:6px solid var(--c);opacity:0;pointer-events:none}
.sp-team .n{font:700 var(--bs-l)/1.15 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;opacity:0;transform-origin:0 60%}
.sp-m{font:500 var(--bs-xs)/1.3 var(--body);margin-top:14px;align-self:stretch;opacity:0;min-height:calc(3 * 1.3 * var(--bs-xs))}
.sp-blitz{position:absolute;inset:-20px;border-radius:14px;opacity:0;pointer-events:none;z-index:-1}   /* hinter Text und Karte */
.sp-toen{position:absolute;inset:0;opacity:0;pointer-events:none}
/* Noch im Rennen: die verdeckten Teams unten in einer Reihe (alphabetisch); beim Aufdecken fliegt das Team in seine Spalte */
.sp-rest{position:absolute;left:0;top:0;width:80px;height:80px;z-index:3;will-change:transform,opacity}
.sp-rest .b{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font:46px/1 var(--emoji);border:4px solid var(--ring);box-shadow:0 0 0 1px var(--line)}
.sp-rest span{position:absolute;left:96px;top:50%;transform:translateY(-50%);font:700 var(--bs-m)/1 var(--head);white-space:nowrap}

/* Awards (17.10.): Titel, Wert und Team links, die Route des Teams rechts über der blassen Karte. Nur dieses Team
   zeigt Farbe und Tier; die anderen Routen und Köpfe sind aus (data-art ist "award", nicht "karte") */
#buehne[data-art=award] #namen,#buehne[data-art=award] .radius{display:none}
.aw-spalte{position:absolute;left:112px;top:0;bottom:var(--unten, 0px);width:860px;display:flex;flex-direction:column;justify-content:center}
.aw-emo{font-size:128px;line-height:1;align-self:flex-start;transform-origin:50% 60%}
.aw-titel{font:700 var(--bs-xl)/1 var(--head);margin-top:24px;letter-spacing:-.01em;text-wrap:balance}
.aw-wert{font:500 var(--bs-m)/1.2 var(--body);color:var(--muted);margin-top:24px;white-space:nowrap}
.aw-wert b{font-family:var(--head);font-weight:700;color:var(--ink)}
.aw-team{display:flex;align-items:center;gap:40px;margin-top:64px;min-width:0}
.aw-team .b{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;font:120px/1 var(--emoji);border:8px solid var(--ring);box-shadow:0 0 0 1px var(--line);flex:none}
.aw-team .n{font:700 128px/1.15 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.aw-auftakt{position:absolute;left:0;right:0;top:0;bottom:var(--unten, 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.aw-auftakt small{font:500 var(--bs-m) var(--body);color:var(--muted);white-space:nowrap}
.aw-auftakt h2{font:700 var(--bs-titel)/1 var(--head);margin:16px 0 0;letter-spacing:-.01em;white-space:nowrap}
.aw-reihe{display:flex;gap:56px;margin-top:56px}
.aw-reihe span{font-size:96px;line-height:1}

/* Siegerbild: Podest 2, 1, 3 */
.sg-podest{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:28px}
.sg-platz{width:460px;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.sg-platz .b{width:168px;height:168px;border-radius:50%;display:grid;place-items:center;font:100px/1 var(--emoji);border:8px solid var(--ring);box-shadow:0 0 0 1px var(--line)}
.sg-platz .n{font:700 var(--bs-l)/1 var(--head);margin-top:20px;white-space:nowrap}
.sg-platz .stufe{width:100%;margin-top:24px;background:var(--card);border:1px solid var(--line);border-top:12px solid var(--c);border-radius:8px 8px 0 0;display:grid;place-items:start center;padding-top:28px}
.sg-platz .stufe .emo{font-size:104px;line-height:1}
.sg-summe{position:absolute;left:0;right:0;text-align:center;font:600 var(--bs-m) var(--head);color:var(--muted);white-space:nowrap}

/* Alle Teams */
.a-kopf{position:absolute;left:80px;top:56px;font:700 var(--bs-l)/1 var(--head)}
.a-netz{position:absolute;left:80px;right:80px;top:176px;bottom:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.a-karte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.a-karte::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c)}
.a-karte .z1{display:flex;justify-content:space-between;align-items:baseline;font:600 var(--bs-xs) var(--head);color:var(--muted);margin-top:4px}
.a-karte .z1 .pl{font:700 var(--bs-s) var(--head);color:var(--ink);white-space:nowrap}
.a-karte .z1 .pl .emo{font-size:40px;vertical-align:-4px;margin-right:6px}
.a-karte .z2{display:flex;align-items:center;gap:16px}
.a-karte .z2 i{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:44px/1 var(--emoji);flex:none}
.a-karte .z2 b{font:700 var(--bs-m)/1 var(--head)}
.a-karte .z3{font:500 var(--bs-xs) var(--body);color:var(--muted);white-space:nowrap}

/* Abspann */
/* Abspann (Nachtrag 17.10.): alle Gruppenfotos laufen in zufälliger Reihenfolge ohne Ende durch, 40 px/s; je Durchlauf neu
   gemischt, die Spalten laufen nahtlos weiter. Drei Blöcke in der Rolle werden wiederverwendet, das DOM wächst nicht */
.rolle{position:absolute;left:0;top:0;width:1920px;will-change:transform}
.rblock{position:absolute;left:0;top:0;width:1920px}
.rollfenster{position:absolute;inset:0 0 var(--unten, 0px) 0;overflow:hidden}
/* weiches Ein- und Auslaufen über zwei stehende Verläufe statt einer Maske (die kostete bei jedem Bild Rechenzeit) */
.rollfenster::before,.rollfenster::after{content:"";position:absolute;left:0;right:0;height:110px;z-index:1;pointer-events:none}
.rollfenster::before{top:0;background:linear-gradient(color-mix(in srgb, var(--paper) 90%, transparent),transparent)}
.rollfenster::after{bottom:0;background:linear-gradient(transparent,color-mix(in srgb, var(--paper) 90%, transparent))}
.rolle .rk{position:absolute;border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 2px 10px rgba(17,17,17,.18)}
.rolle .rk img{width:100%;height:100%;object-fit:cover;display:block}
.rolle .ru{position:absolute;display:flex;align-items:center;gap:8px;font:600 var(--bs-xs)/1 var(--head);white-space:nowrap;overflow:hidden}
.rolle .ru small{font:500 24px var(--body);color:var(--muted);margin-left:auto}
.ab-karte{position:absolute;z-index:3;left:64px;bottom:calc(64px + var(--unten, 0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 44px}
.ab-karte h2{font:700 var(--bs-l)/1 var(--head);margin:0}
.ab-karte p{font:500 var(--bs-s) var(--body);color:var(--muted);margin:12px 0 0;white-space:nowrap}

/* Vorbereiten (vor dem Start, auch auf dem Beamer sichtbar) */
/* --unten: Höhe der festen Leiste unten, in Bühnen-Pixel umgerechnet (skalieren()); die Panels bleiben darüber */
/* Nur im Mockup: Direktsprünge zu den neuen Momenten, oben über dem Panel (104 px) */
.v-spruenge{position:absolute;left:0;right:0;top:20px;padding:0 48px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 12px;font:600 var(--bs-xs) var(--head);color:var(--muted);white-space:nowrap}
.v-spruenge button{font:600 var(--bs-xs) var(--head);color:var(--ink);background:var(--card);border:1.5px solid var(--feld);border-radius:8px;min-height:56px;padding:0 16px;cursor:pointer;white-space:nowrap}
.v-spruenge button:hover{border-color:var(--ink)}
.v-panel{position:absolute;left:50%;top:calc((1080px - var(--unten, 0px) + 168px) / 2);transform:translate(-50%,-50%) scale(var(--vs, 1));width:1120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:56px 64px 52px}
.v-panel h1{font:700 var(--bs-l)/1 var(--head);margin:0;display:flex;align-items:center;gap:20px}
.v-panel h1 svg{width:64px;height:64px}
.v-liste{margin:40px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px}
.v-liste li{display:grid;grid-template-columns:48px 1fr;column-gap:16px;font:500 var(--bs-s)/1.25 var(--body)}
.v-liste li svg{width:40px;height:40px;margin-top:2px}
.v-liste li small{display:block;grid-column:2;font-size:var(--bs-xs);color:var(--muted);margin-top:2px}
.v-liste .ok svg{color:var(--ok)}
.v-liste .warn svg{color:var(--warn)}
.v-opt{display:flex;flex-direction:column;gap:6px;margin-top:36px;border-top:1px solid var(--line);padding-top:28px}
.v-opt label{display:flex;align-items:center;gap:18px;font:500 var(--bs-s) var(--body);min-height:64px;cursor:pointer}
.v-opt input{width:36px;height:36px;accent-color:var(--flag);margin:0;flex:none}
.v-opt .link{font:600 var(--bs-xs) var(--body);color:var(--muted);text-decoration:underline;background:none;border:0;padding:12px 0;cursor:pointer;margin-left:54px;align-self:flex-start;min-height:56px}
.v-fuss{display:flex;align-items:center;gap:32px;margin-top:32px}
.v-fuss .start{flex:none;border:0;border-radius:10px;background:var(--flag);color:var(--flag-ink);font:700 var(--bs-m) var(--head);padding:0 48px;min-height:96px;cursor:pointer}
.v-fuss .start:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
.v-fuss .dauer{font:500 var(--bs-s) var(--body);color:var(--muted)}
.v-fuss .dauer b{color:var(--ink);font-family:var(--head);white-space:nowrap}
.v-tasten{margin-top:28px;font:500 var(--bs-xs) var(--body);color:var(--muted);display:flex;flex-wrap:wrap;column-gap:40px;row-gap:10px}
.v-tasten span{white-space:nowrap}
.v-tasten[hidden]{display:none}
.v-tasten kbd,.hilfe kbd{font:600 .9em var(--head);border:1.5px solid var(--feld);border-radius:6px;padding:0 10px;color:var(--ink);white-space:nowrap}

/* Fotos durchsehen */
.d-panel{position:absolute;inset:48px 48px calc(48px + var(--unten, 0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 48px;display:flex;flex-direction:column}
.d-panel h2{font:700 var(--bs-m) var(--head);margin:0}
.d-panel p{font:500 var(--bs-xs) var(--body);color:var(--muted);margin:8px 0 0}
.d-reihen{flex:1;display:flex;flex-direction:column;gap:12px;margin-top:20px;overflow:hidden}
.d-reihe{display:flex;align-items:center;gap:10px}
.d-reihe .nr{width:52px;height:52px;border-radius:50%;background:var(--flag);color:var(--flag-ink);display:grid;place-items:center;font:700 var(--bs-xs) var(--head);flex:none;margin-right:10px}
.d-bild{width:90px;height:120px;border-radius:8px;overflow:hidden;position:relative;border:0;padding:0;cursor:pointer;background:var(--paper);flex:none}
.d-bild img{width:100%;height:100%;object-fit:cover;display:block}
.d-bild span{position:absolute;left:0;right:0;bottom:0;font:24px/1.3 var(--emoji);background:color-mix(in srgb, var(--card) 85%, transparent)}
.d-bild.aus img{opacity:.22}
.d-bild.aus::after{content:"aus";position:absolute;inset:0;display:grid;place-items:center;font:700 var(--bs-xs) var(--head);color:var(--ink)}
.d-panel .fertig{align-self:flex-end;border:0;border-radius:10px;background:var(--flag);color:var(--flag-ink);font:700 var(--bs-s) var(--head);padding:0 40px;min-height:72px;cursor:pointer;margin-top:16px}

/* Tastenhilfe */
.hilfe{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:1080px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:44px 56px;box-shadow:var(--schatten)}
.hilfe h2{font:700 var(--bs-m) var(--head);margin:0 0 20px}
.hilfe table{border-collapse:collapse;width:100%;font:500 var(--bs-s) var(--body)}
.hilfe td{padding:9px 0;vertical-align:top}
.hilfe td:first-child{width:380px;white-space:nowrap}

/* ---------- Steuerleiste (Bildschirm-Pixel, nicht skaliert; nur mit Maus) ---------- */
#leiste{position:fixed;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--card);border-top:1px solid var(--line);font:600 15px var(--head);color:var(--ink);transition:opacity .16s var(--kurve),transform .16s var(--kurve);z-index:10}
#leiste.weg{opacity:0;transform:translateY(8px);pointer-events:none}
#leiste button{min-height:48px;min-width:48px;border-radius:10px;border:1.5px solid var(--feld);background:transparent;color:var(--ink);font:700 15px var(--head);padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#leiste button.haupt{background:var(--flag);border-color:var(--flag);color:var(--flag-ink);min-width:116px;justify-content:center}
#leiste svg{width:18px;height:18px;fill:currentColor}
#leiste .spur{flex:1;display:flex;gap:3px;height:12px;margin:0 10px;min-width:120px}
#leiste .spur span{flex:var(--d);background:var(--line);border-radius:2px;position:relative;overflow:hidden;cursor:pointer}
#leiste .spur span i{position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--flag)}
#leiste .kap{min-width:180px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#leiste .zeit{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#schwarz{position:fixed;inset:0;background:#000;z-index:9;display:none}
#schwarz.an{display:block}
@media (max-width:900px){ #leiste .kap,#leiste .zeit{display:none} }
@media (prefers-reduced-motion:reduce){ #leiste{transition:none} }
</style>

<body>
<div id="buehne" aria-live="off">
  <div class="osm" id="osm" hidden>© OpenStreetMap-Mitwirkende</div>
  <svg id="welt" aria-hidden="true"><g id="grund"></g><g id="spuren"></g></svg>
  <svg id="schirm" viewBox="0 0 1920 1080" aria-hidden="true"><g id="namen"></g><g id="stationen"></g><g id="pulse"></g><g id="koepfe"></g></svg>
  <div id="szenen"></div>
  <div id="ueber"></div>
</div>
<div id="leiste" class="weg" role="toolbar" aria-label="Steuerung">
  <button data-k="zurueck" title="Zurück (Pfeil links)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>Zurück</button>
  <button data-k="spiel" class="haupt" id="bSpiel"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><span>Start</span></button>
  <button data-k="weiter" title="Weiter (Pfeil rechts)">Weiter<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <div class="spur" id="lSpur"></div>
  <span class="kap" id="lKap"></span>
  <span class="zeit" id="lZeit"></span>
  <button data-k="thema" title="Hell oder dunkel (T)">Hell/Dunkel</button>
  <button data-k="voll" title="Vollbild (F)">Vollbild</button>
  <button data-k="hilfe" title="Tasten (H)">Tasten</button>
</div>
<div id="schwarz"></div>

<script src="prag-karte.js"></script>
<script>
"use strict";
/* =====================================================================
   Beispieldaten in der Form der echten RPCs (admin_state, admin_tracks,
   admin_photos). Die Show selbst liest nur DATEN, siehe aufbereiten().
   ===================================================================== */
const $ = s => document.querySelector(s);
const MIN = 60000;
const TEAM_COLORS = ["#2F6E9E", "#2E7D4F", "#7B3FA0", "#C62828", "#F9A825", "#00838F", "#AD1457", "#4E6E1F",
  "#E65100", "#3949AB", "#00695C", "#8D6E63", "#D81B60", "#455A64", "#0277BD", "#9E9D24"];
const TEAM_EMOJI = { fuchs: "🦊", wolf: "🐺", eule: "🦉", tiger: "🐯", panda: "🐼", einhorn: "🦄", flamingo: "🦩",
  pinguin: "🐧", delfin: "🐬", adler: "🦅", igel: "🦔", otter: "🦦", krake: "🐙", biber: "🦫", koala: "🐨", drache: "🐉" };
const teamEmoji = n => TEAM_EMOJI[String(n || "").toLowerCase()] || "🐾";
const MEDAILLE = ["🥇", "🥈", "🥉"];
const schriftAuf = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.55 ? "#17302A" : "#FFFFFF"; };

function zufall(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Projektion: Meter um einen Bezugspunkt in Holešovice/Letná (für 1 km genau genug)
const LAT0 = 50.1000, LNG0 = 14.4235, KX = 71520, KY = 111200;
const P = (lat, lng) => [(lng - LNG0) * KX, (LAT0 - lat) * KY];
const LL = (x, y) => [LAT0 - y / KY, LNG0 + x / KX];

const BEISPIEL = (() => {
  const R = zufall(20261017);
  const T0 = new Date(2026, 9, 17, 14, 0, 12).getTime(), TEND = new Date(2026, 9, 17, 16, 40, 0).getTime();
  const STATIONEN = [
    { position: 1, name: "Planetarium Prag", lat: 50.105286, lng: 14.427406, radiusM: 50 },
    { position: 2, name: "Rudolfstollen", lat: 50.104441, lng: 14.419553, radiusM: 60 },
    { position: 3, name: "Wasserturm Letná", lat: 50.100195, lng: 14.420089, radiusM: 50 },
    { position: 4, name: "Aussicht Letná", lat: 50.095789, lng: 14.425346, radiusM: 50 },
    { position: 5, name: "Metronom", lat: 50.094775, lng: 14.415938, radiusM: 50 }];
  const START = { name: "Hotel Mama Shelter", lat: 50.102458, lng: 14.431681 };
  const WEGE = [
    [[50.1036, 14.4317], [50.1047, 14.4311], [50.1053, 14.4291]],
    [[50.1059, 14.4252], [50.1057, 14.4222], [50.1049, 14.4203]],
    [[50.1034, 14.4191], [50.1021, 14.4207], [50.1010, 14.4198]],
    [[50.0992, 14.4213], [50.0981, 14.4233], [50.0968, 14.4249]],
    [[50.0957, 14.4229], [50.0955, 14.4201], [50.0951, 14.4176]]];
  const UMWEG = { Pinguin: { 1: [[50.1063, 14.4262], [50.1076, 14.4240], [50.1070, 14.4208], [50.1052, 14.4200]] },
    Flamingo: { 3: [[50.0995, 14.4247], [50.0986, 14.4282], [50.0972, 14.4268]] },
    Wolf: { 4: [[50.0962, 14.4232], [50.0966, 14.4196], [50.0955, 14.4178]] } };
  const NAMEN = ["Adler", "Delfin", "Einhorn", "Eule", "Flamingo", "Fuchs", "Igel", "Otter", "Panda", "Pinguin", "Tiger", "Wolf"];
  const TEMPO = { Adler: .78, Eule: .84, Tiger: .88, Fuchs: .93, Wolf: .97, Panda: 1, Delfin: 1.04, Pinguin: 1.08, Einhorn: 1.2, Flamingo: 1.3, Otter: 1.12, Igel: 1.38 };
  const GEHEN = [8, 10, 9, 10, 11], RAETSEL = [6, 9, 7, 11, 8];
  const STECKT = { Otter: 5, Igel: 4 };              // rätselt beim Spielende noch an dieser Station
  const OHNE_GPS = new Set();                         // im Mockup hat jedes Team GPS (Friedrich 17.10.); der Fall bleibt im Code
  const LUECKE = { Otter: [T0 + 31 * MIN, T0 + 45 * MIN] };   // Handy in der Tasche
  const OHNE_FOTO = new Set(["Delfin:1", "Pinguin:3", "Wolf:4"]);
  const VOR = ["Anna", "Ben", "Clara", "David", "Emre", "Fatma", "Greta", "Hannes", "Ida", "Jonas", "Kira", "Lars", "Mia", "Nils", "Olga", "Paul",
    "Rosa", "Sven", "Tara", "Uwe", "Vera", "Wim", "Yara", "Zoe", "Aylin", "Bruno", "Carla", "Dennis", "Elif", "Finn", "Gül", "Henrik"];
  const NACH = ["Berger", "Demir", "Keller", "Krüger", "Hoffmann", "Schröder", "Wagner", "Neumann", "Schulz", "Hofmann", "Franke", "Martin",
    "Yılmaz", "Lehmann", "Peters", "Graf", "Vogel", "Kaya", "Brandt", "Busch", "Arnold", "Lorenz", "Sommer", "Winter"];
  const leute = new Set(); while (leute.size < 96) leute.add(VOR[Math.floor(R() * VOR.length)] + " " + NACH[Math.floor(R() * NACH.length)]);
  const alle = [...leute];

  const along = (wp, f) => {   // Punkt bei Anteil f der Länge eines Linienzugs
    const seg = []; let L = 0;
    for (let i = 1; i < wp.length; i++) { const d = Math.hypot(wp[i][0] - wp[i - 1][0], wp[i][1] - wp[i - 1][1]); seg.push(d); L += d; }
    let s = f * L;
    for (let i = 0; i < seg.length; i++) {
      if (s <= seg[i] || i === seg.length - 1) { const u = seg[i] ? Math.min(1, s / seg[i]) : 0;
        const a = wp[i], b = wp[i + 1], nx = -(b[1] - a[1]) / (seg[i] || 1), ny = (b[0] - a[0]) / (seg[i] || 1);
        return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, nx, ny]; }
      s -= seg[i];
    }
  };
  const teams = [], tracks = [], fotos = [];
  NAMEN.forEach((name, ti) => {
    const f = TEMPO[name], seite = (R() - .5) * 16, pts = [], sts = [];
    const punkt = (x, y, t, s = 4) => pts.push([x + (R() - .5) * s * 2, y + (R() - .5) * s * 2, t]);
    let t = T0 + R() * 1.5 * MIN, cur = P(START.lat, START.lng), fertig = null;
    for (let k = 0; k < 5; k++) {
      const s = STATIONEN[k], ziel = P(s.lat, s.lng);
      const wp = [cur, ...((UMWEG[name] && UMWEG[name][k]) || WEGE[k]).map(p => P(p[0], p[1])), ziel];
      const gehen = GEHEN[k] * f * (0.85 + R() * 0.3) * MIN;
      for (let tt = t; tt < t + gehen; tt += 15000 + (R() - .5) * 6000) {
        const a = along(wp, (tt - t) / gehen); punkt(a[0] + a[2] * seite, a[1] + a[3] * seite, tt);
      }
      const an = t + gehen, ein = an + (0.3 + R() * 0.6) * MIN;
      const st = { position: k + 1, checkedInAt: new Date(ein).toISOString(), solvedAt: null };
      sts.push(st);
      if (STECKT[name] === k + 1) { for (let tt = an; tt < TEND; tt += 60000) punkt(ziel[0] + 18, ziel[1] - 10, tt, 6); break; }
      const geloest = ein + RAETSEL[k] * f * (0.7 + R() * 0.6) * MIN;
      st.solvedAt = new Date(geloest).toISOString();
      if (!OHNE_FOTO.has(name + ":" + (k + 1))) fotos.push({ teamName: name, position: k + 1, stationName: s.name, route: "echt", takenAt: new Date(geloest + (0.6 + R() * 0.6) * MIN).toISOString() });
      const weg = geloest + (1.2 + R() * 0.8) * MIN;
      for (let tt = an; tt < weg; tt += 60000) punkt(ziel[0] + (R() - .5) * 20, ziel[1] + (R() - .5) * 20, tt, 3);
      t = weg; cur = ziel;
      if (k === 4) fertig = weg + (0.8 + R() * 1.6) * MIN;

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if ((k === " " || k === "Enter") && document.activeElement && document.activeElement.matches("input,button") && Z.phase !== "show") return;
  const nachEnde = () => { if (Z.phase === "durchsehen") return false; if (Z.phase !== "show") $("#ueber").innerHTML = ""; return true; };
  const tat = {
    " ": () => spielPause(true), k: () => spielPause(true), K: () => spielPause(true), F5: () => spielPause(true),
    ArrowRight: weiter, PageDown: weiter, Enter: weiter, n: weiter,
    ArrowLeft: zurueck, PageUp: zurueck, Backspace: zurueck, p: zurueck,
    Home: () => { if (!nachEnde()) return; if (Z.phase !== "show") return starten(); Z.spielt = true; geheZu(0); knopf(); },
    // Notbremse: Ende springt zur Rangliste
    End: () => { if (!nachEnde()) return; if (Z.phase !== "show") kapitelBauen(); const i = K.findIndex(x => x.id === "rangliste");
      Z.spielt = true; geheZu(i >= 0 ? i : K.length - 2); knopf(); },
    f: vollbild, F: vollbild, t: thema, T: thema, b: schwarz, B: schwarz, ".": schwarz, r: () => rand(), R: () => rand(),
    h: hilfe, H: hilfe, "?": hilfe, Escape: () => { const h = $("#hilfeBox"); if (h) h.remove(); }
  }[k];
  // M2: gehaltene Taste rast nicht durch die Kapitel (außer H)
  if (e.repeat && !["h", "H", "?"].includes(k)) { if (tat) e.preventDefault(); return; }
  if ($("#schwarz").classList.contains("an") && !["b", "B", "."].includes(k)) { schwarz(); e.preventDefault(); return; }
  if (!tat) return;
  e.preventDefault(); tat();
});

/* ---------- Bühne skalieren ---------- */
function skalieren() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080) * (OPT.rand ? .94 : 1), b = $("#buehne");
  b.style.transform = `scale(${s}) translate(-50%,-50%)`;
  // Die Leiste liegt fest am Fensterrand, nicht auf der Bühne: ihre Höhe in Bühnen-Pixel, damit Panels darüber bleiben
  const l = $("#leiste"), unten = l ? l.offsetHeight / s - Math.max(0, (innerHeight - 1080 * s) / 2) / s : 0;
  b.style.setProperty("--unten", Math.max(0, unten) + "px");
  // Passt das Vorbereiten-Panel nicht über die Leiste, wird es kleiner statt abgeschnitten (kein Scrollen auf dem Beamer);
  // wird es dabei klein, fällt die Tastenzeile weg (K10)
  const v = $(".v-panel");
  if (v) {
    const frei = 1080 - Math.max(0, unten) - 48 - 168, tz = v.querySelector(".v-tasten");
    tz.hidden = false;
    if (frei / v.offsetHeight < .9) tz.hidden = true;
    v.style.setProperty("--vs", Math.min(1, frei / v.offsetHeight));
  }
}
addEventListener("resize", skalieren);

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.dataset.theme && Z.phase !== "show") themaNeu(); });
